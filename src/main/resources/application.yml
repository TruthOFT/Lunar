spring:
  application:
    name: LunarBackend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://101.34.238.130:3306/lunar?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true
    username: lunar
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  servlet:
    context-path: /api
  port: 7000
  tomcat:
    max-swallow-size: -1

app:
  apk-dir: apk
  base-url: http://101.34.238.130:7000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lunar.lunar_backend.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

